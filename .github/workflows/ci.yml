name: CI

# Each proof runs as its own matrix job (parallel runners), on amd64 and arm64.
# Every job builds the fam chain from committed sources, then runs ONE proof, so
# a failure points at exactly one property on one binary. No continue-on-error:
# every job gates the merge.

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - '*'
  schedule:
    - cron: '15 7 * * *'  # nightly 07:15 UTC
  workflow_dispatch:

jobs:
  proofs:
    name: ${{ matrix.config.platform }} - ${{ matrix.task }}
    runs-on: ${{ matrix.config.runner }}
    # Backstop: a wedged job (e.g. apt lock) dies in minutes with logs, instead of
    # running to the default 360-min limit and tying up a runner.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        config:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
        task:
          - build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show host info
        run: |
          uname -a
          python3 --version

      - name: ${{ matrix.task }}
        run: ./.ci/${{ matrix.task }}
        env:
          PLATFORM: ${{ matrix.config.platform }}
